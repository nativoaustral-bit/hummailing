{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña — Hummailing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#173960',
                            'navy-dark': '#0F243E',
                            blue: '#0C6FAC',
                            'blue-light': '#24A7DB',
                            orange: '#F59A29',
                            cream: '#EFEAE1',
                            bg: '#F8FAFC',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-brand-bg p-4 antialiased font-sans">
    <div class="max-w-md w-full bg-white border border-slate-200 rounded-2xl p-8 shadow-xl">
        
        <!-- Logo Hummailing -->
        <div class="text-center mb-6">
            <img src="{% static 'img/logo.svg' %}" alt="Hummailing Logo" class="h-12 mx-auto mb-3">
            <h1 class="text-lg font-bold text-slate-800">Recuperar Contraseña</h1>
            <p class="text-xs text-slate-500 mt-1">Ingresa el correo electrónico asociado a tu cuenta y te enviaremos un enlace para restablecerla.</p>
        </div>
        
        <form method="post" action="{% url 'password_reset' %}">
            {% csrf_token %}
            {% if form.errors %}
                <div class="bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg p-3 mb-4 text-center font-medium">
                    Por favor verifica el correo ingresado.
                </div>
            {% endif %}
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Correo Electrónico</label>
                    <input type="email" name="email" required autofocus placeholder="tu@correo.cl" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-blue focus:bg-white transition-all">
                </div>
            </div>
            
            <button type="submit" class="w-full bg-brand-blue hover:bg-brand-navy text-white font-bold py-3 px-4 rounded-xl mt-6 uppercase tracking-wider text-sm shadow-md transition-colors flex items-center justify-center space-x-2">
                <span>Enviar enlace de recuperación</span>
                <span>→</span>
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center">
            <a href="{% url 'login' %}" class="text-xs font-semibold text-brand-blue hover:text-brand-navy transition-colors inline-flex items-center space-x-1">
                <span>←</span>
                <span>Volver a iniciar sesión</span>
            </a>
        </div>
    </div>
</body>
</html>
