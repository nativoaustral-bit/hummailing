{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Restablecida — Hummailing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#173960',
                            'navy-dark': '#0F243E',
                            blue: '#0C6FAC',
                            'blue-light': '#24A7DB',
                            orange: '#F59A29',
                            cream: '#EFEAE1',
                            bg: '#F8FAFC',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-brand-bg p-4 antialiased font-sans">
    <div class="max-w-md w-full bg-white border border-slate-200 rounded-2xl p-8 shadow-xl text-center">
        
        <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-100 text-2xl">
            ✓
        </div>
        
        <h1 class="text-xl font-bold text-slate-800 mb-2">¡Contraseña restablecida!</h1>
        <p class="text-xs text-slate-600 leading-relaxed mb-6">
            Tu contraseña ha sido actualizada exitosamente. Ya puedes iniciar sesión en Hummailing con tus nuevas credenciales.
        </p>

        <a href="{% url 'login' %}" class="inline-flex items-center justify-center w-full bg-brand-blue hover:bg-brand-navy text-white font-bold py-3 px-4 rounded-xl text-xs uppercase tracking-wider shadow-md transition-colors space-x-2">
            <span>Iniciar sesión ahora</span>
            <span>→</span>
        </a>
    </div>
</body>
</html>
