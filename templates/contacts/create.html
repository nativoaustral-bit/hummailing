{% extends 'base.html' %}

{% block title %}Nuevo Contacto | Hummailing{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-4 space-y-6">
    <div class="flex items-center space-x-2">
        <a href="{% url 'contacts:list' %}" class="text-xs font-bold text-brand-blue hover:underline">← Volver a Contactos</a>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
        <h1 class="text-xl font-bold text-brand-navy mb-1">Registrar Nuevo Contacto</h1>
        <p class="text-xs text-slate-500 mb-6">Agrega un prospecto o cliente a la base de datos de tu organización.</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Correo Electrónico *</label>
                <input type="email" name="email" required placeholder="correo@empresa.cl" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:ring-2 focus:ring-brand-blue focus:outline-none">
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre</label>
                    <input type="text" name="first_name" placeholder="Roberto" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:ring-2 focus:ring-brand-blue focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Apellido</label>
                    <input type="text" name="last_name" placeholder="González" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:ring-2 focus:ring-brand-blue focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Empresa / Emprendimiento</label>
                    <input type="text" name="company" placeholder="Nombre de la empresa" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:ring-2 focus:ring-brand-blue focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Cargo</label>
                    <input type="text" name="job_title" placeholder="ej. Gerente Comercial" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:ring-2 focus:ring-brand-blue focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Teléfono</label>
                    <input type="text" name="phone" placeholder="+56 9 1234 5678" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:ring-2 focus:ring-brand-blue focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Rubro / Industria</label>
                    <input type="text" name="industry" placeholder="Tecnología, Minería..." class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:ring-2 focus:ring-brand-blue focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Comuna / Ciudad</label>
                    <input type="text" name="city" placeholder="Santiago" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:ring-2 focus:ring-brand-blue focus:outline-none">
                </div>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
                <a href="{% url 'contacts:list' %}" class="text-xs font-bold text-slate-500 hover:text-slate-800 px-4 py-2">Cancelar</a>
                <button type="submit" class="bg-brand-blue hover:bg-brand-navy text-white text-xs font-bold px-6 py-2.5 rounded-xl shadow-md transition-colors">
                    Guardar Contacto
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
